version: '3.8'
services:
  server:
    image: node:18
    working_dir: /workspace
    volumes:
      - ..:/workspace
    # Run the server directly without package installation.  The code is
    # implemented in plain JavaScript and does not require a build step.
    command: bash -c "node packages/server/index.js"
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
  worker:
    image: node:18
    working_dir: /workspace
    volumes:
      - ..:/workspace
    # Run the worker directly.  It depends on the server for context but does
    # not require package installation.  Ensure FIXTURE_PATH is set via env.
    command: bash -c "node packages/worker/index.js"
    environment:
      - FIXTURE_PATH=fixtures/sector_returns.csv
    depends_on:
      - server
  python-sidecar:
    image: python:3.11
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: bash -c "pip install -r packages/python/requirements.txt && tail -f /dev/null"
    depends_on:
      - server